<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root (the systemd service) may own the Yubix helper name. -->
  <policy user="root">
    <allow own="io.github.codingncaffeine.yubix"/>
  </policy>

  <!-- Anyone may talk to it; every method is authorized through polkit. -->
  <policy context="default">
    <allow send_destination="io.github.codingncaffeine.yubix"/>
  </policy>
</busconfig>
